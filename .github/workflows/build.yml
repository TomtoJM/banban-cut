name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.SIGNING_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Same key on every build, so the phone accepts each new APK as an update.
      # The key sits encrypted in signing/; one secret unlocks it.
      - name: Restore signing key
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        if: env.HAS_KEY == 'true'
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/release.p12.enc \
            -out "$RUNNER_TEMP/release.p12" -pass env:SIGNING_PASSWORD
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          KEY_ALIAS: banban
          KEY_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/banban-cut-v${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: banban-cut-v${{ github.run_number }}
          path: out/*.apk

      # Only signed builds from main become a release; the app checks the latest one for updates.
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${GITHUB_RUN_NUMBER}" out/*.apk \
            --title "0.1.${GITHUB_RUN_NUMBER}" \
            --notes "$(git log -1 --pretty=%s)"
