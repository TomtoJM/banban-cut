name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.SIGNING_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Same key on every build, so the phone accepts each new APK as an update.
      # The key sits encrypted in signing/; one secret unlocks it.
      - name: Restore signing key
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        if: env.HAS_KEY == 'true'
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/release.p12.enc \
            -out "$RUNNER_TEMP/release.p12" -pass env:SIGNING_PASSWORD
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          KEY_ALIAS: banban
          KEY_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/banban-cut-v${GITHUB_RUN_NUMBER}.apk"

      # Pictures of each screen, so a build can be checked on a computer before installing it.
      - name: Screenshots
        continue-on-error: true
        run: |
          # Free stock photos (picsum.photos, Unsplash licence) for the sample carousel.
          mkdir -p app/build/sample
          n=1; for id in 20 1 60 4 180 42 119; do curl -sfL -o "app/build/sample/$n.jpg" "https://picsum.photos/id/$id/1600/1200" || true; n=$((n+1)); done
          ./gradlew --no-daemon testDebugUnitTest --tests app.banban.cut.ScreenshotTest --tests app.banban.cut.SimulationTest
          mkdir -p shots
          for f in app/build/screens/*.png; do cp "$f" "shots/screen-$(basename "$f")"; done
          cp app/build/screens/sim.txt shots/ 2>/dev/null && cat shots/sim.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: banban-cut-v${{ github.run_number }}
          path: |
            out/*.apk
            shots/*.png
            shots/*.txt

      # Only signed builds from main become a release; the app checks the latest one for updates.
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${GITHUB_RUN_NUMBER}" out/*.apk $(ls shots/*.png 2>/dev/null) \
            --title "0.1.${GITHUB_RUN_NUMBER}" \
            --notes "$(git log -1 --pretty=%s)"

  # Saves real slides with videos on an Android emulator: video needs the phone's GPU and
  # encoder, which the screenshot tests can't use. Frames land on the "video-check" pre-release.
  video-check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Make test clips
        run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          mkdir -p app/src/androidTest/assets
          ffmpeg -loglevel error -y -f lavfi -i testsrc2=size=1280x720:rate=30 -f lavfi -i sine=frequency=440:sample_rate=44100 -t 5 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest app/src/androidTest/assets/land.mp4
          ffmpeg -loglevel error -y -f lavfi -i testsrc2=size=720x1280:rate=30 -t 4 -c:v libx264 -pix_fmt yuv420p app/src/androidTest/assets/port.mp4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Save videos on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest || touch failed
            mkdir -p videocheck
            for f in 1-video-photo 2-photo-video 3-two-videos 4-full-video; do adb exec-out run-as app.banban.cut cat files/videocheck/$f.png > videocheck/$f.png || true; adb exec-out run-as app.banban.cut cat files/videocheck/$f.mp4 > videocheck/$f.mp4 || true; done
            adb logcat -d | grep -E "VIDEOCHECK|ExportException|Transformer|AndroidRuntime|TestRunner" | tail -120 || true
            test ! -f failed

      - name: Share frames
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la videocheck || exit 0
          find videocheck -size -2k -delete
          gh release view video-check >/dev/null 2>&1 || gh release create video-check --prerelease --title "video check" --notes "Frames from the latest emulator run of VideoExportTest."
          gh release upload video-check videocheck/* --clobber || true
